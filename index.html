<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kilamba – Placas Toponímicas 3D</title>
<style>
:root{--bg:#fff;--fg:#14213d;--pn:rgba(255,255,255,.93);--bd:#c9d1e3;--ac:#1f3a93;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151f;--fg:#e8ecf6;--pn:rgba(20,27,40,.93);--bd:#2c3750;--ac:#8fa8ff}}
:root[data-theme="dark"]{--bg:#10151f;--fg:#e8ecf6;--pn:rgba(20,27,40,.93);--bd:#2c3750;--ac:#8fa8ff}
html,body{height:100%;margin:0}body{background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#p{position:fixed;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:290px;max-width:calc(100% - 20px);max-height:46vh;overflow:auto;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px}
h1{font-size:15px;margin:0 0 8px;color:var(--ac)}button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer}
button:hover,button.on{border-color:var(--ac);color:var(--ac)}.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
label{display:block;font-size:12px;margin:6px 0}input[type=range]{width:100%}
.lg{font-size:12px;display:flex;gap:12px;margin:6px 0}.d{display:inline-block;width:11px;height:11px;margin-right:4px;vertical-align:-1px}
#list button{display:block;width:100%;text-align:left;margin-top:4px;font-size:12px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.brand img,#bd img{background:#fff;border-radius:8px;padding:3px 6px;height:42px;display:block}
.brand small{font-size:11px;opacity:.75;line-height:1.3}
#bd{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:11px}
</style></head><body>

['M',494,287,'AVENIDA','VAN-DÚNEM “LOY”'],['M',822,287,'AVENIDA','ARISTIDES PEREIRA'],['M',298,450,'AVENIDA','PASCOAL LUVUALU'],['M',484,657,'RUA','OLIVER TAMBO'],['M',813,657,'AVENIDA','NEVES BENDINHA'],['M',988,466,'AVENIDA','PAIVA DOMINGOS DA SILVA']];
const green=new T.MeshStandardMaterial({color:0x1f6b3a,metalness:.4,roughness:.5}),sg=[],pos=[];
function cyl(r,h,x,y,m,p){const o=new T.Mesh(new T.CylinderGeometry(r,r,h,10),m);o.position.set(x,y,0);p.add(o)}
const tc=s=>s.toLowerCase().replace(/(^|[\s“-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/ (De|Da|Do|Dos|Das) /g,x=>x.toLowerCase());
const grey=new T.MeshStandardMaterial({color:0x9aa0a6,metalness:.7,roughness:.4});
function withLogo(fn){if(LG.complete&&LG.naturalWidth)fn();else LG.addEventListener('load',fn)}
function texM(l1,l2){const c=document.createElement('canvas');c.width=512;c.height=416;const g=c.getContext('2d');
 g.fillStyle='#f4f4f1';g.fillRect(0,0,512,416);g.strokeStyle='#111';g.lineWidth=18;g.strokeRect(9,9,494,398);
 g.textAlign='center';g.fillStyle='#111';g.font='bold 72px Arial,sans-serif';g.fillText(tc(l1),256,110);
 g.fillStyle='#10a06b';g.fillRect(34,150,444,110);g.strokeStyle='#111';g.lineWidth=5;g.strokeRect(34,150,444,110);
 g.fillStyle='#fff';const t=tc(l2);let s=66;do{g.font='bold '+s+'px Arial,sans-serif';s-=2}while(g.measureText(t).width>400&&s>18);g.fillText(t,256,150+55+s*.36);
 const tx=new T.CanvasTexture(c);tx.anisotropy=8;withLogo(()=>{g.fillStyle='#fff';g.fillRect(150,290,212,100);g.drawImage(LG,156,296,200,Math.min(88,200*LG.naturalHeight/LG.naturalWidth));tx.needsUpdate=true});
 return new T.MeshStandardMaterial({map:tx,roughness:.45})}
function texB(){const c=document.createElement('canvas');c.width=512;c.height=170;const g=c.getContext('2d');
 g.fillStyle='#1d3f9c';g.fillRect(0,0,512,170);g.strokeStyle='#fff';g.lineWidth=8;g.strokeRect(6,6,500,158);g.fillStyle='#fff';g.textAlign='center';g.font='bold 92px Arial,sans-serif';g.fillText('KILAMBA',256,115);
 return new T.MeshStandardMaterial({map:new T.CanvasTexture(c),roughness:.4})}
function tileSign(g,l1,l2){const top=2.0;g.add(Object.assign(new T.Mesh(new T.BoxGeometry(1.5,1.12,.08),new T.MeshStandardMaterial({color:0xffffff})),{}));g.children[0].position.y=top;
 const f1=new T.Mesh(new T.PlaneGeometry(1.4,1.05),tex(l1,l2));f1.position.set(0,top,.045);const f2=f1.clone();f2.rotation.y=Math.PI;f2.position.z=-.045;g.add(f1,f2);
 cyl(.04,2.6,-.5,1.3,green,g);cyl(.04,2.6,.5,1.3,green,g)}
function metalSign(g,l1,l2){cyl(.05,3.4,0,1.7,grey,g);
 const bk=new T.MeshStandardMaterial({color:0x111111});const m=texM(l1,l2),y=2.7;
 const fr=new T.Mesh(new T.BoxGeometry(1.62,1.32,.05),bk);fr.position.y=y;g.add(fr);
 const a=new T.Mesh(new T.PlaneGeometry(1.6,1.3),m);a.position.set(0,y,.03);const b=a.clone();b.rotation.y=Math.PI;b.position.z=-.03;g.add(a,b);
 const bm=texB(),f3=new T.Mesh(new T.BoxGeometry(1.5,.5,.04),new T.MeshStandardMaterial({color:0xffffff}));f3.position.y=1.8;g.add(f3);
 const c=new T.Mesh(new T.PlaneGeometry(1.46,.46),bm);c.position.set(0,1.8,.025);const d=c.clone();d.rotation.y=Math.PI;d.position.z=-.025;g.add(c,d)}
S.forEach(([ty,px,py,l1,l2],i)=>{const g=new T.Group();if(ty=='A')tileSign(g,l1,l2);else metalSign(g,l1,l2);
 const x=cx(px),z=cz(py);g.position.set(x,.5,z);sc.add(g);sg.push(g);
 const pin=new T.Mesh(new T.ConeGeometry(7,26,12),new T.MeshStandardMaterial({color:ty=='A'?0xf2c200:0x1f6fe0,emissive:ty=='A'?0x7a6000:0x0a2f70}));pin.rotation.x=Math.PI;pin.position.set(x,60,z);sc.add(pin);
 const b=document.createElement('button');b.innerHTML='<i class="d" style="background:'+(ty=='A'?'#f2c200':'#1f6fe0')+(ty=='M'?';border-radius:50%':'')+'"></i>'+(i+1)+'. '+l1+' '+l2;b.onclick=()=>fly(x,1.5,z,4+sc_s()*1.2,1.45,0);document.getElementById('list').appendChild(b)});
const sc_s=()=>+document.getElementById('sl').value;
const sl=document.getElementById('sl');sl.oninput=()=>{document.getElementById('sv').textContent=sl.value;sg.forEach(g=>g.scale.setScalar(+sl.value))};sl.oninput();
// camera
const cur={x:0,y:0,z:-70,d:3800,ph:.9,th:0},go={...cur};
function fly(x,y,z,d,ph,th){Object.assign(go,{x,y,z,d,ph,th})}
const b1=document.getElementById('b1'),b2=document.getElementById('b2'),b3=document.getElementById('b3');
b1.onclick=()=>fly(0,0,-70,3800,.9,0);b2.onclick=()=>fly(cx(621),0,cz(460),700,1.05,.5);
let pan=false;b3.onclick=()=>{pan=!pan;b3.textContent='Modo: '+(pan?'mover':'girar')};
const ps=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ps.set(e.pointerId,e);if(ps.size==2){const[a,b]=[...ps.values()];pd=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}});
cv.addEventListener('pointerup',e=>ps.delete(e.pointerId));cv.addEventListener('pointercancel',e=>ps.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{const o=ps.get(e.pointerId);if(!o)return;const dx=e.clientX-o.clientX,dy=e.clientY-o.clientY;ps.set(e.pointerId,e);
 if(ps.size==2){const[a,b]=[...ps.values()],n=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);go.d=Math.min(6000,Math.max(2,go.d*pd/n));pd=n;return}
 if(pan||e.shiftKey||e.buttons==2){const k=go.d*.0016;go.x+=(-Math.cos(go.th)*dx-Math.sin(go.th)*dy)*k;go.z+=(Math.sin(go.th)*dx-Math.cos(go.th)*dy)*k}
 else{go.th-=dx*.006;go.ph=Math.min(1.5,Math.max(.1,go.ph-dy*.005))}});
cv.addEventListener('wheel',e=>{e.preventDefault();go.d=Math.min(6000,Math.max(2,go.d*(1+e.deltaY*.0012)))},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',rs);rs();
(function L(){for(const k in cur)cur[k]+=(go[k]-cur[k])*.08;
 cam.position.set(cur.x+cur.d*Math.sin(cur.ph)*Math.sin(cur.th),cur.y+cur.d*Math.cos(cur.ph),cur.z+cur.d*Math.sin(cur.ph)*Math.cos(cur.th));cam.lookAt(cur.x,cur.y,cur.z);
 R.render(sc,cam);requestAnimationFrame(L)})();
